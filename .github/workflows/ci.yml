name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      # MYSQL, ET LA MEME VERSION QUE `compose.yaml`.
      #
      # Ce fichier demarrait encore `postgres:17` et installait `pdo_pgsql`
      # apres la migration vers MySQL (D-051) : la pile locale et les scripts
      # avaient ete portes, pas le CI. Or l'application REFUSE de demarrer sur
      # tout autre moteur — le controle est un test a part entiere. Le CI ne
      # pouvait donc plus passer, et personne ne s'en apercevait puisque plus
      # rien ne le lisait.
      #
      # Les barrieres de securite du projet sont des declencheurs MySQL et des
      # revocations de droits table par table : les tester sur SQLite ne
      # prouverait rien.
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: phoenix_test
          MYSQL_USER: phoenix_owner
          MYSQL_PASSWORD: ci_owner_password
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl, gd, zip, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      # Le meme partage des comptes qu'en local (docker/init-roles.sql) :
      # l'application ne tourne JAMAIS sous le compte proprietaire du schema,
      # c'est ce qui rend le journal d'audit inalterable.
      #
      # AUCUN `GRANT ... ON phoenix_test.*` pour le compte applicatif, meme
      # « pour demarrer » : sur MySQL les droits de base et de table
      # s'ADDITIONNENT, et un droit de base ne peut pas etre repris par une
      # revocation sur une table. Les droits sont poses table par table par les
      # migrations.
      - name: Créer le compte applicatif
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pci_root_password <<'SQL'
            CREATE USER IF NOT EXISTS 'phoenix_app'@'%' IDENTIFIED BY 'ci_app_password';
            GRANT ALL PRIVILEGES ON `phoenix_test`.* TO 'phoenix_owner'@'%' WITH GRANT OPTION;
          SQL

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci_app_password/' .env
          sed -i 's/^DB_OWNER_PASSWORD=.*/DB_OWNER_PASSWORD=ci_owner_password/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=phoenix_test/' .env
          php artisan key:generate
          php artisan phoenix:generate-index-key

      # Les tests utilisent DatabaseTransactions et NON RefreshDatabase : le
      # compte applicatif n'a pas le droit DROP, et c'est voulu. Le schema doit
      # donc exister AVANT la suite, migre par le compte proprietaire.
      - name: Migrer la base de test
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: phoenix_test
          DB_PASSWORD: ci_app_password
          DB_OWNER_PASSWORD: ci_owner_password
        run: php artisan migrate --database=mysql_owner --force

      - name: Vérifier le formatage
        run: ./vendor/bin/pint --test

      - name: Lancer les tests
        env:
          DB_HOST: 127.0.0.1
          DB_PASSWORD: ci_app_password
          DB_OWNER_PASSWORD: ci_owner_password
        run: ./vendor/bin/phpunit

      - name: Audit des dépendances
        run: composer audit --no-interaction
        continue-on-error: true
