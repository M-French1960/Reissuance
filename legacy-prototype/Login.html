<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="sign.css" />
</head>
<body>
  <div class="form-card">
    <h1>Sign Up</h1>
    <center><img src="H:\WEBSITES\PROJECT\Reissuance\logo.png" alt="" style="height: 100px;width: 100px;"></center>

    <form id="signup-form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Choose a username"
          required
        />
        <div class="error-msg" id="username-error"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Choose a password"
          required
        />
        <div class="error-msg" id="password-error"></div>
      </div>   
      <button type="submit" class="submit-btn">Sign Up</button>

      <p class="link">
        Don't have an account? <a href="signin.html">Log in</a>
      </p>
    </form>
  </div>

  <script>
    const form = document.getElementById('signup-form');

    const usernameInput = document.getElementById('username');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    const usernameError = document.getElementById('username-error');
    const emailError = document.getElementById('email-error');
    const passwordError = document.getElementById('password-error');
    const genderError = document.getElementById('gender-error');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      // Clear errors
      usernameError.textContent = '';
      emailError.textContent = '';
      passwordError.textContent = '';
      genderError.textContent = '';

      const username = usernameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      // Get selected gender
      const selectedGender = document.querySelector('input[name="gender"]:checked');
      const gender = selectedGender ? selectedGender.value : '';

      let hasError = false;

      if (!username) {
        usernameError.textContent = 'Username is required.';
        hasError = true;
      }

      if (!email) {
        emailError.textContent = 'Email is required.';
        hasError = true;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailError.textContent = 'Enter a valid email.';
        hasError = true;
      }

      if (!password) {
        passwordError.textContent = 'Password is required.';
        hasError = true;
      } else if (password.length < 4) {
        passwordError.textContent = 'Password must be at least 4 characters.';
        hasError = true;
      }

      if (!gender) {
        genderError.textContent = 'Please select a gender.';
        hasError = true;
      }

      if (hasError) return;

      // Save user data (frontend only demo)
      localStorage.setItem('userName', username);
      localStorage.setItem('userEmail', email);
      localStorage.setItem('userGender', gender);
      // Don’t store real passwords like this in production.
      localStorage.setItem('userPassword', password);

      // Go to dashboard
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
