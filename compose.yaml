# Pile locale PHOENIX (docs/ARCHITECTURE_LOCAL.md).
# Remplace Dockerfile.vercel / Caddyfile / vercel.json, rendus caducs par D-011.

services:
  db:
    image: mysql:8.4
    # utf8mb4_unicode_ci n'est pas un detail d'affichage : la recherche par nom
    # et par reference est insensible a la casse PARCE QUE l'interclassement
    # l'est. Un interclassement binaire la rendrait silencieusement incomplete
    # (D-051).
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: phoenix
      MYSQL_USER: phoenix_owner
      MYSQL_PASSWORD: ${DB_OWNER_PASSWORD:-changez-moi-en-local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changez-moi-en-local}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      # Volume nomme : les donnees survivent au redemarrage, ce que
      # l'hebergement conteneurise ne permettait pas.
      - phoenix-db:/var/lib/mysql
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mail:
    # Collecteur local : aucun courriel ne quitte jamais la machine de
    # developpement. Interface web sur http://localhost:8025
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  phoenix-db:
